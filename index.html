<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Podpora streamu - QR platba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #18181b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #27272a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      text-align: left;
      font-size: 14px;
      color: #a1a1aa;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background-color: #18181b;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background-color: #9146ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #772ce8;
    }
    .btn:disabled {
      background-color: #52525b;
      cursor: not-allowed;
    }
    #qrContainer {
      margin-top: 20px;
    }
    #qrCode {
      max-width: 250px;
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Podpořit stream 💜</h1>

    <label for="note">Vaše jméno / Nickname:</label>
    <input type="text" id="note" placeholder="Napište váš nick..." value="Anonymní dárce">

    <label for="customAmount">Částka (Kč):</label>
    <input type="number" id="customAmount" value="100" min="10">

    <button class="btn" onclick="generateQR()">Vygenerovat QR kód</button>

    <div id="qrContainer" style="display: none;">
      <p style="font-size: 14px; color: #a1a1aa; margin-top: 15px;">Naskenujte v aplikaci své banky:</p>
      <img id="qrCode" src="" alt="QR platba">
      <br>
      <button class="btn" id="sendAlertBtn" style="background-color: #22c55e; margin-top: 15px;" onclick="sendAlert()">Odeslat alert na stream 🚀</button>
    </div>
  </div>

  <script>
    const NETLIFY_FUNCTION_URL = '/.netlify/functions/send-alert';

    function generateQR() {
      const amount = document.getElementById('customAmount').value || '100';
      const note = document.getElementById('note').value.trim() || 'Podpora streamu';

      // Úprava pro formát CZ QR platby (SPD)
      // Nahraď CZ8907100000000123456789 za svůj IBAN, pokud ho chceš mít napevno v QR kódu
      const iban = "CZ8907100000000123456789"; 
      const spdString = `SPD*1.0*ACC:${iban}*AM:${amount}*CC:CZK*MSG:${encodeURIComponent(note)}`;
      
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(spdString)}`;

      document.getElementById('qrCode').src = qrApiUrl;
      document.getElementById('qrContainer').style.display = 'block';
    }

    async function sendAlert() {
      const btn = document.getElementById('sendAlertBtn');
      const username = document.getElementById('note').value.trim() || 'Anonymní dárce';
      const amount = document.getElementById('customAmount').value || '100';

      btn.disabled = true;
      btn.innerText = "Odesílám alert...";

      try {
        const response = await fetch(NETLIFY_FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            username: username,
            amount: parseFloat(amount),
            message: `Zaplaceno přes QR kód (${amount} Kč)`
          })
        });

        const result = await response.json();

        if (result.success) {
          alert("Alert byl úspěšně odeslán na stream! 🚀");
        } else {
          console.log("Detail odpovědi:", result);
          alert(`Chyba: ${result.error || JSON.stringify(result.apiResponse || result)}`);
        }
      } catch (err) {
        console.error(err);
        alert("Nepodařilo se spojit s alert serverem.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Odeslat alert na stream 🚀";
      }
    }
  </script>
</body>
</html>
