<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Podpora streamu - QR platba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #18181b;
      /* Pokud chceš vlastní obrázek na pozadí, odkomentuj řádek níže a vlož odkaz/soubor */
      /* background-image: url('pozadi.jpg'); */
      background-size: cover;
      background-position: center;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: rgba(39, 39, 42, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      max-width: 400px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(5px);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #fff;
    }
    label {
      display: block;
      margin-top: 15px;
      text-align: left;
      font-size: 14px;
      color: #a1a1aa;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #3f3f46;
      background-color: #18181b;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 16px;
    }
    .amounts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .amount-btn {
      padding: 10px;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      background-color: #18181b;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .amount-btn:hover, .amount-btn.active {
      background-color: #9146ff;
      border-color: #9146ff;
    }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 6px;
      background-color: #9146ff;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #772ce8;
    }
    #qrContainer {
      margin-top: 20px;
    }
    #qrCode {
      max-width: 220px;
      width: 100%;
      height: auto;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Podpořit stream 💜</h1>

    <label for="nickname">Vaše jméno / Nickname:</label>
    <input type="text" id="nickname" placeholder="Napište váš nick..." value="Anonymní dárce">

    <label>Vyberte nebo zadejte částku (Kč):</label>
    <div class="amounts-grid">
      <button class="amount-btn" onclick="setAmount(50)">50 Kč</button>
      <button class="amount-btn active" onclick="setAmount(100)">100 Kč</button>
      <button class="amount-btn" onclick="setAmount(200)">200 Kč</button>
      <button class="amount-btn" onclick="setAmount(500)">500 Kč</button>
      <button class="amount-btn" onclick="setAmount(1000)">1000 Kč</button>
      <button class="amount-btn" onclick="setAmount(2000)">2000 Kč</button>
    </div>
    <input type="number" id="customAmount" value="100" min="1" style="margin-top: 10px;" oninput="clearActiveButtons()">

    <button class="btn" onclick="generateQR()">Vygenerovat QR platbu</button>

    <div id="qrContainer" style="display: none;">
      <p style="font-size: 14px; color: #a1a1aa; margin-top: 15px;">Naskenujte v aplikaci své banky:</p>
      <img id="qrCode" src="" alt="QR platba">
    </div>
  </div>

  <script>
    function setAmount(val) {
      document.getElementById('customAmount').value = val;
      document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function clearActiveButtons() {
      document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
    }

    function generateQR() {
      const amount = document.getElementById('customAmount').value || '100';
      const nickname = document.getElementById('nickname').value.trim() || 'Podpora streamu';
      const message = `Podpora: ${nickname}`;

      // Sem si můžeš případně upravit svůj IBAN, pokud ho chceš mít v QR kódu
      const iban = "CZ8907100000000123456789"; 
      const spdString = `SPD*1.0*ACC:${iban}*AM:${amount}*CC:CZK*MSG:${encodeURIComponent(message)}`;
      
      const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(spdString)}`;

      document.getElementById('qrCode').src = qrApiUrl;
      document.getElementById('qrContainer').style.display = 'block';
    }
  </script>
</body>
</html>
