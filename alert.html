<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background: transparent;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .alert-box {
      position: absolute;
      top: 50px;
      left: 50px;
      background: linear-gradient(135deg, #18181b, #27272a);
      border: 2px solid #d4af37;
      color: #fff;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
      width: 350px;
      opacity: 0;
      transform: translateY(-30px) scale(0.9);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .alert-box.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .title { color: #d4af37; font-size: 1rem; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
    /* Jméno je nyní ve zlaté barvě (#d4af37) */
    .name { font-size: 1.4rem; font-weight: bold; margin-bottom: 5px; color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
    .amount { font-size: 1.6rem; color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <div id="alertBox" class="alert-box">
    <div class="title">Nová podpora streamu 💜</div>
    <div id="donorName" class="name">Jméno</div>
    <div id="donorAmount" class="amount">0 Kč</div>
  </div>

  <!-- Vyměněno za jemnější a příjemnější zvuk cinknutí/notifikace -->
  <audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2865/2865-preview.mp3"></audio>

  <script>
    const alertChannel = new BroadcastChannel('stream_donate_channel');

    alertChannel.onmessage = (event) => {
      if (event.data && event.data.name) {
        showAlert(event.data.name, event.data.amount);
      }
    };

    function showAlert(name, amount) {
      const box = document.getElementById('alertBox');
      document.getElementById('donorName').innerText = name;
      document.getElementById('donorAmount').innerText = amount + " Kč";

      // Přehrát zvuk
      const sound = document.getElementById('alertSound');
      sound.currentTime = 0;
      sound.play().catch(e => console.log("Audio zablokováno prohlížečem"));

      // Zobrazit alert
      box.classList.add('show');

      // Skrýt po 7 vteřinách
      setTimeout(() => {
        box.classList.remove('show');
      }, 7000);
    }
  </script>
</body>
</html>
